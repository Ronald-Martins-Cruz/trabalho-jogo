# Publica o jogo no GitHub Pages a cada push na main (fase 23).
#
# Para ligar (uma vez so, no GitHub): Settings -> Pages -> Build and deployment
# -> Source: "GitHub Actions". Com o repositorio privado, o Pages exige plano
# pago: torne o repositorio publico antes (Settings -> General -> Danger Zone
# -> Change visibility). O endereco fica https://ronald-martins-cruz.github.io/trabalho-jogo/
#
# So o jogo vai para o site (index.html, style.css, src/, data/): os testes,
# os documentos e o todo.md ficam so no repositorio. Sem passo de build: os
# arquivos sao copiados como estao. O check (node puro, sem npm install) roda
# antes e segura a publicacao se o jogo estiver quebrado.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confere o jogo (npm run check)
        run: node test/check.mjs
      - name: Monta o site
        run: |
          mkdir _site
          cp -r index.html style.css src data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: publicacao
        uses: actions/deploy-pages@v4
